[package]
name = "ceventic-system"
version = "1.0.0"
description = "Ceventic System desktop application"
authors = ["Ceventic"]
edition = "2021"

[lib]
name = "ceventic_system_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
